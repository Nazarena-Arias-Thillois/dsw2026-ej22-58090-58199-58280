<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio de Sesion</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="login_style.css">
  <link rel="stylesheet" href="logo.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="login.js"></script>
</head>
<body>
  <div class="login-container">
    <div class="logo">
      <img src="logo.png" alt="Logo de la Aplicación">
    </div>
    <br>
    <div class="nombre-hospital">
      MedPortal
    </div>
    <br>
    <form>
      <div class="login-form">
        <div class="bienvenido">
          Bienvenido de nuevo
        </div>
        <div class="autenticacion">
          Por favor, autentíquese para acceder al portal de proveedores. 
        </div>
        <div class="ingreso">
        <label for="username">Nombre de usuario</label>
          <div class="entrada">
            <i class="fa-regular fa-user input-icon icon-left"></i>
              <input 
                type="text" 
                placeholder="Ingrese ID de admin" 
                id="username" 
                name="username" 
                required>
          </div>
        <label for="password">Contraseña</label>
          <div class="entrada">
            <i class="fas fa-lock"></i>
              <input 
                type="password" 
                placeholder="Contraseña" 
                id="password" 
                name="password" 
                required> 
                <i class="fa-solid fa-eye-slash icon-right" id="togglePassword"></i>
          </div>
        </div>
        <button type="submit">
          Iniciar Sesión
          <i class="fa-solid fa-right-to-bracket"></i>
        </button>
      </div>
      <div class="recordatorio">
        <i class="fas fa-shield-halved"></i>
          <p><strong> Solo Acceso Seguro:</strong>
            Este sistema es para personal médico autorizado.
            Los intentos de acceso no autorizados son registrados
            y monitoreados para su cumplimiento.
          </p>
      </div>
    </form>
  </div>
</body>
</html>
